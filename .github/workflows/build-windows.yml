name: Build RustDesk Windows x86_64

on:
  push:
    branches:
      - master
      - main
      - windows
  pull_request:
    branches:
      - master
      - main
      - windows
  workflow_dispatch:

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VERSION: "1.4.8"

jobs:
  build-windows-x64:
    name: Build Windows x86_64
    runs-on: windows-2022
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc

      - name: Install rustfmt
        run: |
          rustup component add rustfmt --toolchain 1.75-x86_64-pc-windows-msvc

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "15.0.6"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: Install vcpkg dependencies
        shell: pwsh
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          $vcpkg = 'C:\vcpkg\vcpkg.exe'
          Write-Host "Installing ffmpeg and common codec ports via vcpkg"
          & $vcpkg install ffmpeg:x64-windows-static
          # optional additional ports; ignore failures if not available
          & $vcpkg install libx264:x64-windows-static || Write-Host "libx264 install skipped or failed"

      - name: Build RustDesk
        shell: pwsh
        env:
          VCPKG_ROOT: C:\vcpkg
          INCLUDE: C:\vcpkg\installed\x64-w

